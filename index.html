<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Saray</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .calculator {
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: flex-end;
    }
    .header {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: auto;
      padding-top: 10px;
    }
    .header .active {
      color: #ffffff;
    }
    .header .inactive {
      color: #555555;
    }
    .display-container {
      text-align: right;
      padding: 20px 10px;
      margin-bottom: 20px;
    }
    #display {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 3.5rem;
      text-align: right;
      outline: none;
      font-weight: 300;
    }
    .cursor-line {
      display: inline-block;
      width: 3px;
      height: 3.2rem;
      background-color: #ff6d00;
      vertical-align: middle;
      margin-left: 2px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    button {
      height: 70px;
      border: none;
      border-radius: 18px;
      background-color: #242424;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.1s;
    }
    button:active {
      opacity: 0.7;
    }
    .orange-text {
      color: #ff6d00;
      font-weight: 600;
    }
    .btn-equal {
      background-color: #ff6d00;
      color: #ffffff;
      font-size: 1.8rem;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">
      <span class="active">Calculadora</span>
      <span class="inactive">Convertidor</span>
    </div>

    <div class="display-container">
      <input type="text" id="display" value="0" readonly><span class="cursor-line"></span>
    </div>

    <div class="buttons">
      <!-- Fila 1 -->
      <button class="orange-text" onclick="clearDisplay()">AC</button>
      <button class="orange-text" onclick="deleteLast()">⌫</button>
      <button class="orange-text" onclick="appendOp('%')">%</button>
      <button class="orange-text" onclick="appendOp('/')">÷</button>

      <!-- Fila 2 -->
      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="orange-text" onclick="appendOp('*')">×</button>

      <!-- Fila 3 -->
      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="orange-text" onclick="appendOp('-')">-</button>

      <!-- Fila 4 -->
      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="orange-text" onclick="appendOp('+')">+</button>

      <!-- Fila 5 -->
      <button class="orange-text">⟯⟮</button>
      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let display = document.getElementById('display');

    function appendNum(num) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = num;
      } else {
        display.value += num;
      }
    }

    function appendOp(op) {
      let lastChar = display.value.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        display.value = display.value.slice(0, -1) + op;
      } else {
        display.value += op;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length > 1) {
        display.value = display.value.slice(0, -1);
      } else {
        display.value = '0';
      }
    }

    function calculate() {
      try {
        let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
        display.value = eval(expression);
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
