<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 18px 30px 18px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }
    .tabs {
      display: flex;
      gap: 20px;
    }
    .tab {
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tab.active {
      color: #ffffff;
    }
    .tab.inactive {
      color: #666666;
    }
    .menu-dots {
      color: #888888;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }
    .display-section {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 10px;
      margin-top: auto;
      margin-bottom: 20px;
    }
    #display {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 3.8rem;
      text-align: right;
      outline: none;
      width: 100%;
      font-weight: 400;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #f96b00;
      margin-left: 2px;
      border-radius: 2px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    button {
      height: 72px;
      border: none;
      border-radius: 22px;
      background-color: #222327;
      color: #ffffff;
      font-size: 1.65rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s, transform 0.1s;
      outline: none;
    }
    button:active {
      filter: brightness(1.3);
      transform: scale(0.96);
    }
    .orange {
      color: #f96b00;
      font-weight: 600;
    }
    .btn-equal {
      background-color: #f96b00;
      color: #ffffff;
      font-size: 1.8rem;
    }
    .btn-equal:active {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="tabs">
        <span class="tab active">Calculadora</span>
        <span class="tab inactive">Convertidor</span>
      </div>
      <div class="menu-dots">⋮</div>
    </div>

    <div class="display-section">
      <input type="text" id="display" value="0" readonly>
      <span class="cursor"></span>
    </div>

    <div class="keypad">
      <!-- Fila 1 -->
      <button class="orange" onclick="clearDisplay()">AC</button>
      <button class="orange" onclick="deleteLast()">⌫</button>
      <button class="orange" onclick="appendOp('%')">%</button>
      <button class="orange" onclick="appendOp('/')">÷</button>

      <!-- Fila 2 -->
      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="orange" onclick="appendOp('*')">×</button>

      <!-- Fila 3 -->
      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="orange" onclick="appendOp('-')">-</button>

      <!-- Fila 4 -->
      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="orange" onclick="appendOp('+')">+</button>

      <!-- Fila 5 -->
      <button class="orange" style="font-size: 1.3rem;">⇄</button>
      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let display = document.getElementById('display');

    function appendNum(num) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = num;
      } else {
        display.value += num;
      }
    }

    function appendOp(op) {
      let lastChar = display.value.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        display.value = display.value.slice(0, -1) + op;
      } else {
        display.value += op;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length > 1) {
        display.value = display.value.slice(0, -1);
      } else {
        display.value = '0';
      }
    }

    function calculate() {
      try {
        let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
        display.value = eval(expression);
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
