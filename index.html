<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calc-app {
      width: 100%;
      max-width: 390px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      color: #a5a5a5;
      font-size: 1.4rem;
    }

    .top-icon {
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .top-icon:active {
      opacity: 1;
    }

    /* Area de Pantalla */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 10px 0 20px 0;
      overflow: hidden;
    }

    .history-text {
      font-size: 1.3rem;
      color: #666666;
      min-height: 1.6rem;
      margin-bottom: 6px;
      text-align: right;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .history-text::-webkit-scrollbar { display: none; }

    .display-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .display-wrapper::-webkit-scrollbar { display: none; }

    .display-text {
      font-size: 4rem;
      font-weight: 300;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -1px;
      transition: font-size 0.1s ease;
    }

    /* Teclado de Botones Redondos */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 10px;
    }

    .btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background-color: #2c2c2e;
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: filter 0.15s, transform 0.08s;
      outline: none;
    }

    .btn:active {
      filter: brightness(1.4);
      transform: scale(0.94);
    }

    /* Botones Gris Claro */
    .btn.light-grey {
      background-color: #8e8e93;
      color: #ffffff;
      font-size: 1.55rem;
    }

    /* Botones Rosado Neón */
    .btn.pink {
      background-color: #ff4794;
      color: #ffffff;
      font-size: 1.85rem;
      font-weight: 500;
    }

    .btn.pink:active {
      filter: brightness(1.25);
    }
  </style>
</head>
<body>

  <div class="calc-app">
    <!-- Iconos superiores -->
    <div class="top-bar">
      <span class="top-icon" onclick="clearAll()">⏱</span>
      <span class="top-icon" onclick="clearAll()">🗑</span>
    </div>

    <!-- Area de Pantalla -->
    <div class="display-container">
      <div class="history-text" id="history"></div>
      <div class="display-wrapper" id="displayWrapper">
        <span class="display-text" id="display">0</span>
      </div>
    </div>

    <!-- Teclado Circular -->
    <div class="keypad">
      <!-- Fila 1 -->
      <button class="btn light-grey" onclick="deleteChar()">⌫</button>
      <button class="btn light-grey" onclick="clearAll()">AC</button>
      <button class="btn light-grey" onclick="appendOp('%')">%</button>
      <button class="btn pink" onclick="appendOp('÷')">÷</button>

      <!-- Fila 2 -->
      <button class="btn" onclick="appendNum('7')">7</button>
      <button class="btn" onclick="appendNum('8')">8</button>
      <button class="btn" onclick="appendNum('9')">9</button>
      <button class="btn pink" onclick="appendOp('×')">×</button>

      <!-- Fila 3 -->
      <button class="btn" onclick="appendNum('4')">4</button>
      <button class="btn" onclick="appendNum('5')">5</button>
      <button class="btn" onclick="appendNum('6')">6</button>
      <button class="btn pink" onclick="appendOp('-')">-</button>

      <!-- Fila 4 -->
      <button class="btn" onclick="appendNum('1')">1</button>
      <button class="btn" onclick="appendNum('2')">2</button>
      <button class="btn" onclick="appendNum('3')">3</button>
      <button class="btn pink" onclick="appendOp('+')">+</button>

      <!-- Fila 5 -->
      <button class="btn" onclick="toggleSign()">⁺/₋</button>
      <button class="btn" onclick="appendNum('0')">0</button>
      <button class="btn" onclick="appendNum(',')">,</button>
      <button class="btn pink" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentExpr = '0';
    let isEvaluated = false;

    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');
    const wrapperEl = document.getElementById('displayWrapper');

    function updateDisplay() {
      displayEl.innerText = currentExpr;
      adjustFontSize();
      scrollToRight();
    }

    function scrollToRight() {
      setTimeout(() => {
        wrapperEl.scrollLeft = wrapperEl.scrollWidth;
      }, 10);
    }

    function adjustFontSize() {
      const len = currentExpr.length;
      if (len > 12) {
        displayEl.style.fontSize = '2.2rem';
      } else if (len > 8) {
        displayEl.style.fontSize = '3rem';
      } else {
        displayEl.style.fontSize = '4rem';
      }
    }

    function appendNum(num) {
      if (isEvaluated) {
        currentExpr = num === ',' ? '0,' : num;
        isEvaluated = false;
        historyEl.innerText = '';
      } else {
        if (currentExpr === '0' && num !== ',') {
          currentExpr = num;
        } else {
          if (num === ',') {
            const parts = currentExpr.split(/[\+\-\×\÷\%]/);
            const lastPart = parts[parts.length - 1];
            if (lastPart.includes(',')) return;
          }
          currentExpr += num;
        }
      }
      updateDisplay();
    }

    function appendOp(op) {
      if (isEvaluated) {
        isEvaluated = false;
        historyEl.innerText = '';
      }

      const lastChar = currentExpr.slice(-1);
      const ops = ['+', '-', '×', '÷', '%'];

      if (ops.includes(lastChar)) {
        currentExpr = currentExpr.slice(0, -1) + op;
      } else {
        currentExpr += op;
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentExpr === '0' || currentExpr === 'Error') return;
      if (currentExpr.startsWith('-')) {
        currentExpr = currentExpr.slice(1);
      } else {
        currentExpr = '-' + currentExpr;
      }
      updateDisplay();
    }

    function clearAll() {
      currentExpr = '0';
      isEvaluated = false;
      historyEl.innerText = '';
      updateDisplay();
    }

    function deleteChar() {
      if (isEvaluated) {
        clearAll();
        return;
      }
      if (currentExpr.length > 1) {
        currentExpr = currentExpr.slice(0, -1);
      } else {
        currentExpr = '0';
      }
      updateDisplay();
    }

    function calculate() {
      if (isEvaluated) return;

      let raw = currentExpr;
      historyEl.innerText = raw + ' =';

      let evalExpr = raw
        .replace(/,/g, '.')
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/%/g, '/100');

      try {
        if (['*', '/', '+', '-'].includes(evalExpr.slice(-1))) {
          evalExpr = evalExpr.slice(0, -1);
        }

        let result = eval(evalExpr);

        if (!isFinite(result) || isNaN(result)) {
          currentExpr = 'Error';
        } else {
          let cleanNum = Number(Math.round(result + 'e10') + 'e-10');
          currentExpr = cleanNum.toString().replace(/\./g, ',');
        }
      } catch (e) {
        currentExpr = 'Error';
      }

      isEvaluated = true;
      updateDisplay();
    }
  </script>
</body>
</html>
