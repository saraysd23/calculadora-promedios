<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Saray</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .calculator {
      background: #161b22;
      border: 2px solid #00d2c8;
      border-radius: 16px;
      padding: 20px;
      width: 310px;
      box-shadow: 0 8px 24px rgba(0, 210, 200, 0.2);
    }
    .title {
      text-align: center;
      color: #00d2c8;
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }
    #display {
      width: 100%;
      height: 60px;
      background: #0d1117;
      border: 1px solid #00d2c8;
      border-radius: 10px;
      color: #00d2c8;
      font-size: 1.8rem;
      text-align: right;
      padding: 10px;
      margin-bottom: 15px;
      outline: none;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 50px;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #21262d;
      color: #00d2c8;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background: #00d2c8;
      color: #0d1117;
    }
    .clear {
      background: #3b0764;
      color: #f472b6;
      border-color: #f472b6;
    }
    .equal {
      grid-column: span 2;
      background: #00d2c8;
      color: #0d1117;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="title">🧮 Calculadora de Saray</div>
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendOp('/')">÷</button>
      <button onclick="appendOp('*')">×</button>
      <button onclick="appendOp('-')">-</button>
      
      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button onclick="appendOp('+')">+</button>

      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="equal" onclick="calculate()">=</button>

      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button onclick="appendNum('0')">0</button>
    </div>
  </div>

  <script>
    let display = document.getElementById('display');
    
    function appendNum(num) {
      if (display.value === '0' || display.value === 'Error') display.value = num;
      else display.value += num;
    }
    
    function appendOp(op) {
      display.value += op;
    }

    function clearDisplay() {
      display.value = '0';
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
