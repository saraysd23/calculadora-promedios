<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calc-app {
      width: 100%;
      max-width: 420px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    }

    /* Encabezado */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .tabs {
      display: flex;
      gap: 20px;
    }

    .tab {
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      color: #ffffff;
    }

    .tab.inactive {
      color: #555555;
    }

    .dots {
      color: #777777;
      font-size: 1.3rem;
      font-weight: bold;
    }

    /* Pantalla de Números */
    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 10px 0;
      overflow: hidden;
    }

    .expression-history {
      font-size: 1.3rem;
      color: #777777;
      min-height: 1.6rem;
      margin-bottom: 8px;
      text-align: right;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .expression-history::-webkit-scrollbar { display: none; }

    .main-display-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .main-display-wrapper::-webkit-scrollbar { display: none; }

    .display-text {
      font-size: 3.5rem;
      font-weight: 300;
      color: #ffffff;
      line-height: 1.1;
      transition: font-size 0.1s ease;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.2rem;
      background-color: #f96b00;
      margin-left: 3px;
      border-radius: 2px;
      animation: blink 1.2s infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Teclado Pro */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-bottom: 10px;
    }

    .btn {
      aspect-ratio: 1.15;
      max-height: 70px;
      border: none;
      border-radius: 22px;
      background-color: #212226;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.1s, transform 0.05s;
    }

    .btn:active {
      background-color: #33343a;
      transform: scale(0.95);
    }

    .btn.orange {
      color: #f96b00;
      font-weight: 600;
    }

    .btn.equal {
      background-color: #f96b00;
      color: #ffffff;
      font-size: 1.8rem;
    }

    .btn.equal:active {
      background-color: #e05e00;
    }
  </style>
</head>
<body>

  <div class="calc-app">
    <!-- Encabezado superior -->
    <div class="header">
      <div class="tabs">
        <span class="tab active">Calculadora</span>
        <span class="tab inactive">Convertidor</span>
      </div>
      <div class="dots">⋮</div>
    </div>

    <!-- Area de Resultado -->
    <div class="display-container">
      <div class="expression-history" id="history"></div>
      <div class="main-display-wrapper" id="displayWrapper">
        <span class="display-text" id="display">0</span>
        <span class="cursor" id="cursor"></span>
      </div>
    </div>

    <!-- Teclado de Botones -->
    <div class="keypad">
      <!-- Fila 1 -->
      <button class="btn orange" onclick="clearAll()">AC</button>
      <button class="btn orange" onclick="deleteChar()">⌫</button>
      <button class="btn orange" onclick="appendOp('%')">%</button>
      <button class="btn orange" onclick="appendOp('÷')">÷</button>

      <!-- Fila 2 -->
      <button class="btn" onclick="appendNum('7')">7</button>
      <button class="btn" onclick="appendNum('8')">8</button>
      <button class="btn" onclick="appendNum('9')">9</button>
      <button class="btn orange" onclick="appendOp('×')">×</button>

      <!-- Fila 3 -->
      <button class="btn" onclick="appendNum('4')">4</button>
      <button class="btn" onclick="appendNum('5')">5</button>
      <button class="btn" onclick="appendNum('6')">6</button>
      <button class="btn orange" onclick="appendOp('-')">-</button>

      <!-- Fila 4 -->
      <button class="btn" onclick="appendNum('1')">1</button>
      <button class="btn" onclick="appendNum('2')">2</button>
      <button class="btn" onclick="appendNum('3')">3</button>
      <button class="btn orange" onclick="appendOp('+')">+</button>

      <!-- Fila 5 -->
      <button class="btn orange" style="font-size: 1.3rem;">⇄</button>
      <button class="btn" onclick="appendNum('0')">0</button>
      <button class="btn" onclick="appendNum('.')">.</button>
      <button class="btn equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentExpr = '0';
    let isEvaluated = false;

    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');
    const wrapperEl = document.getElementById('displayWrapper');
    const cursorEl = document.getElementById('cursor');

    function updateDisplay() {
      displayEl.innerText = currentExpr;
      adjustFontSize();
      scrollToRight();
    }

    function scrollToRight() {
      setTimeout(() => {
        wrapperEl.scrollLeft = wrapperEl.scrollWidth;
      }, 10);
    }

    function adjustFontSize() {
      const len = currentExpr.length;
      if (len > 14) {
        displayEl.style.fontSize = '1.8rem';
        cursorEl.style.height = '1.8rem';
      } else if (len > 9) {
        displayEl.style.fontSize = '2.4rem';
        cursorEl.style.height = '2.4rem';
      } else {
        displayEl.style.fontSize = '3.5rem';
        cursorEl.style.height = '3.2rem';
      }
    }

    function appendNum(num) {
      if (isEvaluated) {
        currentExpr = num;
        isEvaluated = false;
        historyEl.innerText = '';
      } else {
        if (currentExpr === '0') {
          currentExpr = num;
        } else {
          if (num === '.') {
            const parts = currentExpr.split(/[\+\-\×\÷\%]/);
            const lastPart = parts[parts.length - 1];
            if (lastPart.includes('.')) return;
          }
          currentExpr += num;
        }
      }
      updateDisplay();
    }

    function appendOp(op) {
      if (isEvaluated) {
        isEvaluated = false;
        historyEl.innerText = '';
      }

      const lastChar = currentExpr.slice(-1);
      const ops = ['+', '-', '×', '÷', '%'];

      if (ops.includes(lastChar)) {
        currentExpr = currentExpr.slice(0, -1) + op;
      } else {
        currentExpr += op;
      }
      updateDisplay();
    }

    function clearAll() {
      currentExpr = '0';
      isEvaluated = false;
      historyEl.innerText = '';
      updateDisplay();
    }

    function deleteChar() {
      if (isEvaluated) {
        clearAll();
        return;
      }
      if (currentExpr.length > 1) {
        currentExpr = currentExpr.slice(0, -1);
      } else {
        currentExpr = '0';
      }
      updateDisplay();
    }

    function calculate() {
      if (isEvaluated) return;

      let raw = currentExpr;
      historyEl.innerText = raw + ' =';

      let evalExpr = raw
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/%/g, '/100');

      try {
        if (['*', '/', '+', '-'].includes(evalExpr.slice(-1))) {
          evalExpr = evalExpr.slice(0, -1);
        }

        let result = eval(evalExpr);

        if (!isFinite(result) || isNaN(result)) {
          currentExpr = 'Error';
        } else {
          let cleanNum = Number(Math.round(result + 'e10') + 'e-10');
          currentExpr = cleanNum.toString();
        }
      } catch (e) {
        currentExpr = 'Error';
      }

      isEvaluated = true;
      updateDisplay();
    }
  </script>
</body>
</html>
