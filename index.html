<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px 20px 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
    }
    .tabs {
      display: flex;
      gap: 18px;
    }
    .tab {
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tab.active {
      color: #ffffff;
    }
    .tab.inactive {
      color: #666666;
    }
    .menu-dots {
      color: #888888;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }
    .display-section {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 10px 5px;
      margin-top: auto;
      margin-bottom: 10px;
      width: 100%;
      overflow: hidden;
    }
    .display-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .display-wrapper::-webkit-scrollbar {
      display: none;
    }
    #display {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 2.8rem;
      text-align: right;
      outline: none;
      width: auto;
      min-width: 20px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      height: 2.6rem;
      background-color: #f96b00;
      margin-left: 2px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 60px;
      border: none;
      border-radius: 18px;
      background-color: #222327;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: filter 0.15s, transform 0.1s;
      outline: none;
    }
    button:active {
      filter: brightness(1.3);
      transform: scale(0.96);
    }
    .orange {
      color: #f96b00;
      font-weight: 600;
    }
    .btn-equal {
      background-color: #f96b00;
      color: #ffffff;
      font-size: 1.7rem;
    }
    .btn-equal:active {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="tabs">
        <span class="tab active">Calculadora</span>
        <span class="tab inactive">Convertidor</span>
      </div>
      <div class="menu-dots">⋮</div>
    </div>

    <div class="display-section">
      <div class="display-wrapper" id="displayWrapper">
        <span id="display">0</span>
        <span class="cursor"></span>
      </div>
    </div>

    <div class="keypad">
      <!-- Fila 1 -->
      <button class="orange" onclick="clearDisplay()">AC</button>
      <button class="orange" onclick="deleteLast()">⌫</button>
      <button class="orange" onclick="appendOp('%')">%</button>
      <button class="orange" onclick="appendOp('/')">÷</button>

      <!-- Fila 2 -->
      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="orange" onclick="appendOp('*')">×</button>

      <!-- Fila 3 -->
      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="orange" onclick="appendOp('-')">-</button>

      <!-- Fila 4 -->
      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="orange" onclick="appendOp('+')">+</button>

      <!-- Fila 5 -->
      <button class="orange" style="font-size: 1.2rem;">⇄</button>
      <button onclick="appendNum('0')">0</button>
      <button onclick="appendNum('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let display = document.getElementById('display');
    let displayWrapper = document.getElementById('displayWrapper');

    function scrollToRight() {
      setTimeout(() => {
        displayWrapper.scrollLeft = displayWrapper.scrollWidth;
      }, 10);
    }

    function adjustFontSize() {
      let len = display.innerText.length;
      if (len > 12) {
        display.style.fontSize = '1.8rem';
      } else if (len > 8) {
        display.style.fontSize = '2.2rem';
      } else {
        display.style.fontSize = '2.8rem';
      }
    }

    function appendNum(num) {
      if (display.innerText === '0' || display.innerText === 'Error') {
        display.innerText = num;
      } else {
        display.innerText += num;
      }
      adjustFontSize();
      scrollToRight();
    }

    function appendOp(op) {
      let text = display.innerText;
      let lastChar = text.slice(-1);
      let showSymbol = op === '*' ? '×' : op === '/' ? '÷' : op;
      
      if (['+', '-', '×', '÷', '%', '*'].includes(lastChar)) {
        display.innerText = text.slice(0, -1) + showSymbol;
      } else {
        display.innerText += showSymbol;
      }
      adjustFontSize();
      scrollToRight();
    }

    function clearDisplay() {
      display.innerText = '0';
      adjustFontSize();
    }

    function deleteLast() {
      let text = display.innerText;
      if (text.length > 1) {
        display.innerText = text.slice(0, -1);
      } else {
        display.innerText = '0';
      }
      adjustFontSize();
      scrollToRight();
    }

    function calculate() {
      try {
        let rawExpression = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
        let result = eval(rawExpression);
        if (typeof result === 'number') {
          result = Math.round(result * 100000000) / 100000000;
        }
        display.innerText = result.toString();
      } catch (e) {
        display.innerText = 'Error';
      }
      adjustFontSize();
      scrollToRight();
    }
  </script>
</body>
</html>
